name: Upload Mini Food Videos

on:
  schedule:
    - cron: '0 9 * * *'    # 9am UTC  — Morning post (Video 1)
    - cron: '0 13 * * *'   # 1pm UTC  — Afternoon post (Video 2)
    - cron: '0 18 * * *'   # 6pm UTC  — Evening post (Video 3)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual uploads)'
        type: boolean
        default: true

jobs:
  upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-video-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: food-video-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Upload next pending video
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python uploader.py --dry-run
          else
            python uploader.py
          fi
