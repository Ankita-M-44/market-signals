name: Generate Mini Food Videos

on:
  schedule:
    - cron: '0 8 * * *'  # 8am UTC daily — generates 3 videos before first upload slot
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no video gen or Notion writes)'
        type: boolean
        default: true

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-video-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: food-video-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run video generation pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python pipeline.py --dry-run
          else
            python pipeline.py
          fi

      - name: Upload generated videos as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos-${{ github.run_id }}
          path: food-video-agent/videos/*.mp4
          retention-days: 7
          if-no-files-found: ignore
